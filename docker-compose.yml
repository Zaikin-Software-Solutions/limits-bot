# Production compose: тянет готовый образ из GHCR.
# Для локальной сборки: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  limits-bot:
    image: ghcr.io/zaikin-software-solutions/limits-bot:latest
    container_name: limits-bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/data
      # Read-only OAuth metadata for the 48h expiry warning.
      - ${CODEX_AUTH_HOST_DIR:-./codex-auth}:/codex-auth:ro
    environment:
      CODEX_AUTH_DIR: /codex-auth
