[project]
name = "limits-bot"
version = "1.0.0"
description = "Telegram bot: следит за лимитами Claude (Max plan) и шлёт push при обнулении недельного окна, порогах утилизации, платном overflow и полной блокировке."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.27,<4",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
